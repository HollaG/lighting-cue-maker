services:
  db:
    image: postgres:18.4
    container_name: lighting_cue_maker_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lighting_cue_maker_server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PORT: ${PORT}
      CORS_URL: ${CORS_URL}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-/certs/fullchain.pem}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-/certs/privkey.pem}
    ports:
      - "${PORT}:${PORT}"
      - "443:6121/udp"
    volumes:
      - type: bind
        source: ${TLS_CERTS_HOST_DIR:-./certs}
        target: /certs
        read_only: true
    depends_on:
      db:
        condition: service_healthy

  # Local Azure Blob Storage emulator, for dev only (production uses a real storage account).
  # Start just this with: docker compose up -d azurite
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: lighting_cue_maker_azurite
    restart: unless-stopped
    # --skipApiVersionCheck: the Go SDK often uses a newer storage API version than Azurite knows yet.
    command: azurite-blob --blobHost 0.0.0.0 --location /data --loose --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data

volumes:
  postgres_data:
  azurite_data:
